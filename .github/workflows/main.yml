name: Build Glass TV Native ADB APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil File dari Repo
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Siapkan Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Bungkus index.html menjadi Project Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f "icon.png" ]; then cp icon.png www/icon.png; fi

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets

          npx cap init "GlassTVRemote" "com.ismanto.glasstvremote" --web-dir www
          npx cap add android

      - name: 5. Pasang Icon.png Otomatis ke APK
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            cp icon.png assets/icon-background.png
            cp icon.png assets/splash.png
            npx capacitor-assets generate --android || true
          fi

      - name: 6. Suntikkan Mesin Native ADB & Jembatan Java
        run: |
          # 1. Konfigurasi Capacitor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ismanto.glasstvremote",
            "appName": "GlassTVRemote",
            "webDir": "www",
            "server": {
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap sync android

          # 2. Tambahkan Izin Jaringan & Android TV Leanback Launcher di AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-feature android:name="android.software.leanback" android:required="false" \/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" \/>/' "$MANIFEST"
          sed -i 's/<category android:name="android.intent.category.LAUNCHER" \/>/<category android:name="android.intent.category.LAUNCHER" \/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" \/>/g' "$MANIFEST"

          # 3. Tambahkan Library Native ADB (Dadb) ke build.gradle
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              implementation 'dev.mobile:dadb:1.2.9'
          }
          EOF

          # 4. Buat File Jembatan Java NativeTvBridge.java
          JAVA_DIR="android/app/src/main/java/com/ismanto/glasstvremote"
          mkdir -p "$JAVA_DIR"

          cat << 'EOF' > "$JAVA_DIR/NativeTvBridge.java"
          package com.ismanto.glasstvremote;

          import android.content.Context;
          import android.net.wifi.WifiInfo;
          import android.net.wifi.WifiManager;
          import android.webkit.JavascriptInterface;
          import dadb.AdbKeyPair;
          import dadb.AdbShellResponse;
          import dadb.Dadb;
          import java.io.File;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.concurrent.TimeUnit;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class NativeTvBridge {
              private Context context;
              private Dadb activeDadb = null;
              private String connectedIp = "";

              public NativeTvBridge(Context context) {
                  this.context = context;
              }

              private AdbKeyPair getOrCreateKeyPair() throws Exception {
                  File priv = new File(context.getFilesDir(), "adbkey");
                  File pub = new File(context.getFilesDir(), "adbkey.pub");
                  if (!priv.exists() || !pub.exists()) {
                      AdbKeyPair.generate(priv, pub);
                  }
                  return AdbKeyPair.read(priv, pub);
              }

              @JavascriptInterface
              public String getPhoneSubnet() {
                  try {
                      WifiManager wm = (WifiManager) context.getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      WifiInfo info = wm.getConnectionInfo();
                      int ip = info.getIpAddress();
                      if (ip != 0) {
                          return String.format("%d.%d.%d", (ip & 0xff), (ip >> 8 & 0xff), (ip >> 16 & 0xff));
                      }
                  } catch (Exception ignored) {}
                  return "192.168.1";
              }

              @JavascriptInterface
              public String scanSubnetNative(String subnet) {
                  JSONArray found = new JSONArray();
                  ExecutorService pool = Executors.newFixedThreadPool(45);
                  List<Future<JSONObject>> futures = new ArrayList<>();

                  for (int i = 2; i <= 254; i++) {
                      final String host = subnet + "." + i;
                      futures.add(pool.submit(() -> {
                          int[] ports = {5555, 6095, 8008};
                          for (int p : ports) {
                              try (Socket s = new Socket()) {
                                  s.connect(new InetSocketAddress(host, p), 180);
                                  JSONObject obj = new JSONObject();
                                  obj.put("ip", host);
                                  obj.put("port", p);
                                  return obj;
                              } catch (Exception ignored) {}
                          }
                          return null;
                      }));
                  }

                  for (Future<JSONObject> f : futures) {
                      try {
                          JSONObject res = f.get(400, TimeUnit.MILLISECONDS);
                          if (res != null) found.put(res);
                      } catch (Exception ignored) {}
                  }
                  pool.shutdownNow();
                  return found.toString();
              }

              @JavascriptInterface
              public String connectAdb(String ip) {
                  try {
                      if (activeDadb != null) {
                          try { activeDadb.close(); } catch (Exception ignored) {}
                      }
                      AdbKeyPair keyPair = getOrCreateKeyPair();
                      activeDadb = Dadb.create(ip, 5555, keyPair);
                      AdbShellResponse resp = activeDadb.shell("getprop ro.product.model");
                      connectedIp = ip;
                      return "OK:" + resp.getAllOutput().trim();
                  } catch (Exception e) {
                      return "ERR:" + e.getMessage();
                  }
              }

              @JavascriptInterface
              public String runShell(String cmd) {
                  try {
                      if (activeDadb == null && !connectedIp.isEmpty()) {
                          activeDadb = Dadb.create(connectedIp, 5555, getOrCreateKeyPair());
                      }
                      if (activeDadb == null) return "ERR:BELUM_TERHUBUNG";
                      AdbShellResponse resp = activeDadb.shell(cmd);
                      return resp.getAllOutput();
                  } catch (Exception e) {
                      return "ERR:" + e.getMessage();
                  }
              }
          }
          EOF

          # 5. Daftarkan NativeTvBridge ke MainActivity.java
          cat << 'EOF' > "$JAVA_DIR/MainActivity.java"
          package com.ismanto.glasstvremote;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webView.addJavascriptInterface(new NativeTvBridge(this), "AndroidTvBridge");
              }
          }
          EOF

          # 6. Kunci Gradle 8.11.1 dan cegah duplikat Kotlin
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties

          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: 7. Compile & Build File APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 8. Upload Hasil File APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-Native-ADB-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
