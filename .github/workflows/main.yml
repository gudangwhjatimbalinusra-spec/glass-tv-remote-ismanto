name: Build Glass TV APK Otomatis

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil File index.html & icon.png dari Repo
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Siapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Bungkus index.html menjadi Project Android Native
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f "icon.png" ]; then cp icon.png www/icon.png; fi

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          npx cap init "GlassTVRemote" "com.ismanto.glasstvremote" --web-dir www
          npx cap add android

      - name: 6. Pasang Icon.png Otomatis ke APK
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            cp icon.png assets/icon-background.png
            cp icon.png assets/splash.png
            npx capacitor-assets generate --android
          fi

      - name: 7. Buka Blokir HTTP IP Lokal Xiaomi TV
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>/' "$MANIFEST"

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ismanto.glasstvremote",
            "appName": "GlassTVRemote",
            "webDir": "www",
            "server": {
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap sync android

      - name: 8. Compile & Build File APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. Upload Hasil File APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-Remote-Xiaomi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
